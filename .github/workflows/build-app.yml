name: Build an app

# Type an idea, press Run. Claude agents take it through spec, design, code,
# tests, review, store listing, screenshots and release build, on a new
# app/<name> branch, and open a draft pull request with the hand-off.

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Your app idea, in your own words (leave empty to continue a branch)"
        required: false
      name:
        description: "Short name for the app's branch (optional)"
        required: false
      continue_branch:
        description: "To continue an unfinished app, its branch, e.g. app/water-buddy"
        required: false
      max_usd:
        description: "Spending limit for Claude for this run, in US dollars"
        default: "60"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: factory-${{ inputs.continue_branch || inputs.name || github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FACTORY_MAX_USD: ${{ inputs.max_usd }}
      FACTORY_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      FACTORY_PACKAGE_PREFIX: ${{ vars.PACKAGE_PREFIX }}
      FACTORY_DEVICE: emulator-5554
    steps:
      - name: Check the inputs
        env:
          IDEA: ${{ inputs.idea }}
          CONTINUE: ${{ inputs.continue_branch }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add your Anthropic API key as the repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "$IDEA" ] && [ -z "$CONTINUE" ]; then
            echo "::error::Type an idea, or give the branch of an app to continue."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the factory's tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code
          flutter config --no-analytics
          flutter precache --android

      - name: Start a new app or continue one
        id: branch
        env:
          IDEA: ${{ inputs.idea }}
          NAME: ${{ inputs.name }}
          CONTINUE: ${{ inputs.continue_branch }}
        run: |
          git config user.name "appstorm[bot]"
          git config user.email "appstorm@users.noreply.github.com"
          if [ -n "$CONTINUE" ]; then
            git checkout "$CONTINUE"
            echo "branch=$CONTINUE" >> "$GITHUB_OUTPUT"
          else
            python3 -m factory start --idea "$IDEA" ${NAME:+--name "$NAME"}
            git push -u origin HEAD
          fi

      - name: Prepare the release signing key (only if you added one)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release builds will be signed with your upload key."
          else
            echo "No upload key secret; the release bundle will need signing before upload."
          fi

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the agents (an Android emulator stays up for tests and screenshots)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 -m factory run --push

      - name: Save the progress to the branch
        if: always()
        run: |
          git add -A
          git commit -q -m "factory: save progress" || true
          git push -u origin HEAD || true

      - name: Upload the store package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-package
          if-no-files-found: warn
          path: |
            docs/HANDOFF.md
            store/
            app/build/app/outputs/bundle/release/*.aab
            app/build/app/outputs/flutter-apk/app-release.apk

      - name: Open a draft pull request with the hand-off
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          title="App: $(python3 -c 'import json;print(json.load(open("docs/app.json"))["name"])' 2>/dev/null || echo "$BRANCH")"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file docs/HANDOFF.md
          else
            gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file docs/HANDOFF.md
          fi

  ios:
    # Proves the iPhone build compiles. Signing and upload need your Apple account.
    needs: build
    if: always() && needs.build.outputs.branch != ''
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.branch }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build for iPhone without signing
        working-directory: app
        run: |
          if [ ! -f pubspec.yaml ]; then echo "The app has not been built yet."; exit 0; fi
          flutter build ios --release --no-codesign
