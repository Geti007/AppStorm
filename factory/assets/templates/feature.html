<!doctype html>
<html>
<head>
<meta charset="utf-8">
{{FONT_LINK}}
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden; box-sizing: border-box;
    background: linear-gradient(135deg, {{PRIMARY}} 0%, {{SECONDARY}} 100%);
    font-family: {{FONT_FAMILY}}, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; gap: 56px; padding: 0 80px;
  }
  img { width: 240px; height: 240px; border-radius: 54px; box-shadow: 0 18px 48px rgba(0,0,0,0.3); flex: none; }
  h1 { color: {{ON_PRIMARY}}; font-size: 64px; line-height: 1.05; margin: 0 0 18px 0; font-weight: 800; }
  p { color: {{ON_PRIMARY}}; opacity: 0.92; font-size: 32px; line-height: 1.25; margin: 0; }
</style>
</head>
<body>
  <img src="{{ICON}}">
  <div><h1>{{NAME}}</h1><p>{{TAGLINE}}</p></div>
</body>
</html>
